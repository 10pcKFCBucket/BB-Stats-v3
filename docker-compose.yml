# Run this on the NAS (via SSH, from inside this folder) with:
#   docker compose up -d --build
#
# Container Station can also import this file directly if you'd rather
# use the GUI: Container Station > Create > Create Application, then
# paste this file's contents in.

services:
  softball-stats:
    build: .
    container_name: softball-stats
    restart: unless-stopped
    ports:
      # host_port:container_port — change 8080 if that port is already
      # used by something else on your NAS (QTS itself often uses 8080).
      - "8090:5000"
    volumes:
      # Left side is a real folder/file on the NAS; right side is where
      # the app looks for it inside the container. Mounting these
      # individually (rather than the whole project) means edits you
      # make on the NAS take effect without needing --build again —
      # gunicorn's --reload flag notices the change and restarts itself.
      - ./data:/app/data
      - ./static:/app/static
      - ./app.py:/app/app.py
      - ./import_data.py:/app/import_data.py
      - ./schema.sql:/app/schema.sql
